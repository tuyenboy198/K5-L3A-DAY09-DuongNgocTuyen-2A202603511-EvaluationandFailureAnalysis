# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket text (injection, false fact, authority) overrides the order row
stale_policy: FM-06            # superseded / not-yet-effective clause cited in the ticket
clause_sum: FM-04              # SHIP-LATE + DMG summed instead of max
double_deduct: FM-05           # prior refund subtracted by the agent, then again by the host
sibling_refund: FM-07          # money written under a sibling claim of the same order
denied_ignored: FM-02          # host denies (expired approval / order already refunded), agent says resolved
reply_ledger_mismatch: FM-08   # approval caps below quote: reply must state the ledger amount
cross_principal: FM-09         # another principal's order / PII
